# Publishes the intro page as the site home and the simulator as a separate page.
# One-time setup in GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish the simulator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Model tests (no install needed)
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare site with the intro page as home
        run: |
          mkdir -p _site
          cp -R src/. _site/
          mv _site/index.html _site/simulator.html
          mv _site/intro.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
